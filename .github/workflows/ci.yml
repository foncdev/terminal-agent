# 푸시와 PR마다 검사한다.
#
# PTY는 플랫폼마다 구현이 달라서 리눅스와 맥 양쪽에서 돌린다.
# 윈도우는 ConPTY가 러너에서 잘 안 뜨는 경우가 있어 빌드만 확인한다.
#
# 러너에는 TERM이 없다. PTY를 만들 때 코드가 기본값을 채우므로 여기서도
# tput이 동작한다. 이게 깨지면 실제 서비스로 띄웠을 때도 vi가 안 뜬다.
#
# PTY 자체를 못 여는 환경(일부 컨테이너)에서는 해당 테스트가 스스로
# 건너뛴다. 그런 곳에서는 검증이 성립하지 않아서다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # 한쪽이 실패해도 다른 쪽 결과를 보고 싶다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: 테스트
        # TUI 테스트는 바이너리를 빌드해 가짜 터미널에서 돌린다.
        # 시간이 걸려 넉넉히 준다.
        run: go test ./... -timeout 300s

  # 실제로 다섯 플랫폼이 다 빌드되는지 본다.
  # CGO 없이 되는 것이 이 프로젝트의 전제라 여기서 지킨다.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 전 플랫폼 빌드
        run: make dist

      - name: 산출물 확인
        run: |
          ls -lh dist/
          # install.sh가 기대하는 이름이 다 있는지 본다.
          for f in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64 windows_amd64; do
            test -f "dist/terminal-agent_$f.tar.gz" || { echo "없음: $f"; exit 1; }
          done
          test -f dist/checksums.txt

  # 설치 스크립트가 셸 문법에 맞는지 본다.
  # 여기가 깨지면 curl | sh 가 통째로 실패한다.
  script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: sh 문법
        run: sh -n install.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -s sh install.sh
